name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Check lockfile
        run: uv lock --check

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Type check
        run: uv run --locked mypy src tests

      - name: Test with coverage
        run: >-
          uv run --locked pytest
          --cov=parallax
          --cov-report=term-missing
          --cov-fail-under=100

      - name: Build package
        run: uv build --no-sources

      - name: Validate soak runner
        run: bash -n scripts/live-soak-acceptance.sh

      - name: Validate acceptance evidence
        run: >-
          uv run python -m json.tool
          docs/evidence/live-soak-2026-09-09.json
          > /dev/null

  web-quality:
    name: Angular quality
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm
        run: npm install --global npm@11.17.0

      - name: Verify JavaScript toolchain
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Test operator console
        run: npm test -- --watch=false

      - name: Build operator console
        run: npm run build
