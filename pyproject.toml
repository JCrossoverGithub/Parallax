[project]
name = "parallax"
version = "0.1.0"
description = "Uncertainty-aware classification of encrypted network traffic metadata"
readme = "README.md"
authors = [
    { name = "Josh Schultz", email = "schultzjosh0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dpkt==1.9.8",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pywavelets==1.8.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "tables>=3.11.1",
    "torch>=2.11.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
parallax = "parallax.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pyarrow-stubs>=20.0.0.20260625",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "scikit-learn-stubs>=0.0.3",
    "scipy-stubs>=1.18.0.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["parallax"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
